[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustgraph"
version = "0.1.0"
description = "Recommendation Stability Tool — the buildable artifact of the AI Trust Graph working paper (Section 6)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.55"]
all = ["google-genai>=1.0", "anthropic>=0.40", "openai>=1.55"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.6"]

[project.scripts]
trustgraph = "trustgraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
